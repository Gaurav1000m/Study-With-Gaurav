<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Advertisement</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      display: flex;
      justify-content: center;
      align-items: center;
      background: transparent;
    }
  </style>
</head>
<body>
  <div id="ad-wrapper"></div>
  <script type="text/javascript">
    (function() {
      try {
        const params = new URLSearchParams(window.location.search);
        const key = params.get('key');
        const width = parseInt(params.get('w') || '728', 10);
        const height = parseInt(params.get('h') || '90', 10);

        if (!key) return;

        window.atOptions = {
          'key': key,
          'format': 'iframe',
          'height': height,
          'width': width,
          'params': {}
        };

        const script = document.createElement('script');
        script.type = 'text/javascript';
        script.src = 'https://www.highrevenueformat.com/' + encodeURIComponent(key) + '/invoke.js';
        document.body.appendChild(script);
      } catch (e) {
        console.error("Failed to load ad banner:", e);
      }
    })();
  </script>
</body>
</html>
